<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تعديل المرتب | Salary Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: #f4f6f8;
            direction: rtl;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
            color: #1f2933;
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            text-align: center;
            text-decoration: none;
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            color: #374151;
            font-weight: 600;
        }

        .cancel:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تعديل مرتب {{ employee.name }}</h1>

        <form method="post">
            <label>إجمالي المرتب</label>
            <input type="number" name="total_salary" value="{{ employee.total_salary }}" required>

            <label>المرتب المسحوب</label>
            <input type="number" name="paid_salary" value="{{ employee.paid_salary }}" required>

            <div class="actions">
                <button type="submit">حفظ التعديلات</button>
                <a href="/salaries" class="cancel">إلغاء</a>
            </div>
        </form>
    </div>

</body>
</html>
