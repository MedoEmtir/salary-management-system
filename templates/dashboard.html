<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Salary Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: #f4f6f8;
            direction: rtl;
        }

        /* Navbar */
        .navbar {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1f2933;
        }

        .navbar .user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            color: #374151;
        }

        .logout {
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            color: #374151;
            transition: 0.2s;
        }

        .logout:hover {
            background: #f3f4f6;
        }

        /* Main */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            font-size: 22px;
            font-weight: 700;
            color: #1f2933;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #1f2933;
        }

        .card p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .card a {
            text-decoration: none;
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .card a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">نظام إدارة المرتبات</div>
        <div class="user">
            <span>مرحباً، المدير</span>
            <a href="/logout" class="logout">تسجيل الخروج</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="welcome">لوحة التحكم</div>
        <div class="subtitle">اختر الخدمة التي ترغب في إدارتها</div>

        <div class="cards">
            <div class="card">
                <h3>إدارة المرتبات</h3>
                <p>
                    عرض تفاصيل مرتبات الموظفين، المرتب المسحوب،
                    المرتب المتبقي، وإجمالي المرتب.
                </p>
                <a href="/salaries">الدخول</a>
            </div>
        </div>
    </div>

</body>
</html>
